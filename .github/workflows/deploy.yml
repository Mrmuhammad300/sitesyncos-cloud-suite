name: Deployment Pipeline

on:
  workflow_run:
    workflows: ["CI/CD Pipeline"]
    types:
      - completed
    branches:
      - main

jobs:
  deploy-dev:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: development
      url: https://dev.sitesyncos.example.com
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application (dev)
        run: npm run build:dev
        env:
          VITE_API_URL: ${{ vars.DEV_API_URL }}
          VITE_SUPABASE_URL: ${{ vars.DEV_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      - name: Deploy to Netlify (development)
        uses: netlify/actions/cli@master
        with:
          args: deploy --dir=dist --alias=dev --message="Deploy from CI (${{ github.event.workflow_run.head_sha }})"
        env:
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}

  deploy-staging:
    if: github.event.workflow_run.conclusion == 'success'
    needs: deploy-dev
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging.sitesyncos.example.com
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application (staging)
        run: npm run build
        env:
          VITE_API_URL: ${{ vars.STAGING_API_URL }}
          VITE_SUPABASE_URL: ${{ vars.STAGING_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      - name: Deploy to Netlify (staging)
        uses: netlify/actions/cli@master
        with:
          args: deploy --dir=dist --alias=staging --message="Staging deploy (${{ github.event.workflow_run.head_sha }})"
        env:
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}

  deploy-production:
    if: github.event.workflow_run.conclusion == 'success'
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://sitesyncos.example.com
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application (production)
        run: npm run build
        env:
          VITE_API_URL: ${{ vars.PROD_API_URL }}
          VITE_SUPABASE_URL: ${{ vars.PROD_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      - name: Deploy to Netlify (production)
        uses: netlify/actions/cli@master
        with:
          args: deploy --dir=dist --prod --message="Production deploy (${{ github.event.workflow_run.head_sha }})"
        env:
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}

      - name: Notify Slack on success
        if: success()
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "text": ":rocket: SiteSync Cloud Suite deployed to production\nCommit: ${{ github.event.workflow_run.head_sha }}\nSHA: `${{ github.event.workflow_run.head_sha }}`"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
        continue-on-error: true

      - name: Deploy Supabase migrations (production)
        run: |
          npx supabase db push --db-url "${{ secrets.PROD_SUPABASE_DB_URL }}"
        continue-on-error: true

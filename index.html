<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SiteSync Cloud Suite</title>
    <meta name="description" content="Construction and real estate portfolio management platform" />
    <meta name="author" content="SiteSync" />
    <meta name="theme-color" content="#0f172a" />

    <meta property="og:title" content="SiteSync Cloud Suite" />
    <meta property="og:description" content="Construction and real estate portfolio management platform" />
    <meta property="og:type" content="website" />

    <link rel="manifest" href="/manifest.json" />

    <!--
      Inline theme initialization — runs synchronously before React mounts
      to prevent flash of unstyled content (FOUC) for dark mode.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("sitesyncos-appearance");
          var darkMode = stored ? JSON.parse(stored).darkMode : null;
          if (typeof darkMode !== "boolean") {
            darkMode = window.matchMedia("(prefers-color-scheme: dark)").matches;
          }
          if (darkMode) {
            document.documentElement.classList.add("dark");
          }
        } catch (e) {}
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>SiteSync OS — Build. Operate. Own.</title>
    <meta name="description" content="SiteSync OS is the operating system for construction and real estate — project delivery, asset operations, investment intelligence and AI agents in one console." />
    <meta name="theme-color" content="#0b0c10" />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <meta property="og:title" content="SiteSync OS — Build. Operate. Own." />
    <meta property="og:description" content="The operating system for the built world." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />

    <script>
      // Apply the saved theme before first paint to avoid a flash.
      (function () {
        try {
          var t = localStorage.getItem("sitesync-theme");
          var dark = t ? t === "dark" || (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches) : true;
          document.documentElement.classList.toggle("dark", dark);
        } catch (e) {}
      })();
    </script>
  </head>

  <body>
    <noscript>SiteSync OS requires JavaScript.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
